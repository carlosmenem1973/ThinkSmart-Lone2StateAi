services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: estateai
      POSTGRES_USER: estateai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U estateai -d estateai"], interval: 10s, timeout: 5s, retries: 10}
    networks: [private]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes: ["redis_data:/data"]
    networks: [private]
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://estateai:${POSTGRES_PASSWORD}@db:5432/estateai
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      COOKIE_SECURE: "false"
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    networks: [private, edge]
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["sh", "-c", "until alembic current 2>/dev/null | grep -q '(head)'; do sleep 3; done; exec celery -A app.workers.celery_app.celery worker --beat --loglevel=INFO"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://estateai:${POSTGRES_PASSWORD}@db:5432/estateai
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    networks: [private]
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [edge]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro", "./certbot/conf:/etc/letsencrypt:ro", "./certbot/www:/var/www/certbot:ro"]
    depends_on: [api, frontend]
    networks: [edge]
volumes: {postgres_data: {}, redis_data: {}}
networks:
  private: {internal: true}
  edge: {}
