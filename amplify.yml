version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - |
              if [ -z "${VITE_API_URL:-}" ]; then
                echo "ERROR: Configure VITE_API_URL in Amplify Hosting environment variables."
                echo "It must point to the FastAPI API origin (for example https://api.example.pt)."
                exit 1
              fi
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
